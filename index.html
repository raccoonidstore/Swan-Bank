<script>
const LIM={topMin:1e4,topMax:1e7,trMin:1e3,trMax:1e7,day:2e7,bal:2e7,fee:2500};
const EWL=['DANA','GoPay','OVO','ShopeePay','LinkAja','Sakuku (BCA)','i.saku','DOKU','Jenius Pay','AstraPay','PayTren','OCTO Pay (CIMB)','Kaspro','Dompetku','Blu Wallet','SeaBank Wallet','Bank Jago Pocket','Yap!','Gudang Voucher Pay','Paypro'];
const EW=Object.fromEntries(EWL.map((n,i)=>['ew_'+n.toLowerCase().replace(/[^a-z0-9]/g,''),[n,'39'+String(i+1).padStart(2,'0')]]));
const METHODS={qris:'QRIS (semua e-wallet & m-banking)',bca_va:'Virtual account BCA',mandiri_va:'Virtual account Mandiri',bni_va:'Virtual account BNI',minimarket:'Alfamart / Indomaret',debit:'Kartu debit (instan)'};
Object.entries(EW).forEach(([k,v])=>{METHODS[k]=v[0]});
const BANKS=[['bca','BCA'],['mandiri','Mandiri'],['bni','BNI'],['bri','BRI'],['bsi','BSI (Bank Syariah Indonesia)'],['cimb','CIMB Niaga'],['permata','Permata'],['danamon','Danamon'],['ocbc','OCBC'],['maybank','Maybank Indonesia'],['panin','Panin'],['btn','BTN'],['bjb','bank bjb'],['mega','Bank Mega'],['btpn','BTPN / Jenius'],['jago','Bank Jago'],['seabank','SeaBank'],['neo','Bank Neo Commerce'],['blu','blu by BCA Digital'],['allo','Allo Bank'],['superbank','Superbank'],['hibank','Hibank'],['muamalat','Bank Muamalat'],['bcasyariah','BCA Syariah'],['uob','UOB Indonesia'],['hsbc','HSBC Indonesia'],['citi','Citibank'],['scb','Standard Chartered'],['dbs','DBS Indonesia'],['sinarmas','Bank Sinarmas'],['kbbukopin','KB Bukopin'],['commonwealth','Commonwealth Bank'],['dki','Bank DKI'],['jatim','Bank Jatim'],['jateng','Bank Jateng'],['diy','BPD DIY'],['bali','BPD Bali'],['sumut','Bank Sumut'],['nagari','Bank Nagari'],['aceh','Bank Aceh Syariah'],['riaukepri','Bank Riau Kepri Syariah'],['jambi','Bank Jambi'],['bengkulu','Bank Bengkulu'],['sumselbabel','Bank Sumsel Babel'],['lampung','Bank Lampung'],['kalbar','Bank Kalbar'],['kalsel','Bank Kalsel'],['kaltimtara','Bank Kaltimtara'],['sulselbar','Bank Sulselbar'],['sulutgo','Bank SulutGo'],['ntb','Bank NTB Syariah'],['ntt','Bank NTT'],['maluku','Bank Maluku Malut'],['papua','Bank Papua'],['victoria','Bank Victoria'],['mnc','MNC Bank'],['artha','Bank Artha Graha'],['mayapada','Bank Mayapada'],['ganesha','Bank Ganesha'],['index','Bank Index Selindo'],['shinhan','Bank Shinhan Indonesia'],['woori','Bank Woori Saudara'],['mizuho','Bank Mizuho Indonesia'],['jtrust','J Trust Bank'],['nobu','Nobu Bank'],['amar','Bank Amar Indonesia'],['raya','Bank Raya Indonesia'],['sbi','Bank SBI Indonesia'],['bnc','BNC (Neo Commerce)'],['ina','Bank Ina Perdana'],['harda','Bank Harda Internasional']].filter((b,i,a)=>a.findIndex(x=>x[0]===b[0])===i);
const okMethod=m=>!!METHODS[m]||BANKS.some(b=>'bank_'+b[0]===m);
const bankName=m=>m.startsWith('bank_')?(BANKS.find(b=>'bank_'+b[0]===m)||[0,''])[1]:(METHODS[m]||'');
const methodName=m=>m&&m.startsWith('bank_')?'Transfer bank '+bankName(m):METHODS[m];
const vaPref=m=>m.startsWith('ew_')?EW[m][1]:m.startsWith('bank_')?String(200+BANKS.findIndex(b=>'bank_'+b[0]===m)):VAP[m];

async function checkPin(pin){if(!P.pin)return'Buat PIN transaksi terlebih dahulu.';const t=nowS();if(P.lock>t)return`PIN terkunci. Coba lagi dalam ${P.lock-t} detik.`;if(P.pin===await H(P.salt+'p'+pin)){P.tries=0;P.lock=0;save();return null}P.tries++;if(P.tries>=5){P.tries=0;P.lock=t+60;save();return'PIN salah terlalu sering. PIN terkunci selama 60 detik.'}save();return`PIN salah. Sisa percobaan: ${5-P.tries}.`}

async function register(name,phone,pass){name=(name||'').trim();const p=normPhone(phone);if(name.length<2)return{err:'Nama minimal 2 karakter'};if(!p)return{err:'Nomor ponsel tidak valid. Contoh: 081234567890'};if((pass||'').length<8)return{err:'Kata sandi minimal 8 karakter'};if(uByPhone(p))return{err:'Nomor ini sudah terdaftar. Silakan masuk.'};const id='u'+(STORE.seq++),salt=rnd();ACC[id]={name,phone:p,ts:nowS(),pw:await H(salt+pass),pws:salt};UID=id;STORE.session=id;loadP();persist();return{ok:1}}

async function payTopup(ref){const t=LED[ref];if(!t||t.type!=='topup'||t.status!=='pending'||t.to!==UID)return{err:'Tagihan isi saldo tidak ditemukan.'};if(t.meta.exp<nowS()){await setLed(t,{status:'expired'});return{err:'Tagihan sudah kedaluwarsa. Buat isi saldo baru.'}}if(bal()+t.amount>LIM.bal)return{err:`Saldo maksimal ${rp(LIM.bal)}. Batalkan dan buat nominal lebih kecil.`};await setLed(t,{status:'success',ts:nowS()});return{ok:1,tx:t}}

csend(){const el=$('#cm'),t=(el?.value||'').trim();if(!t)return;const ts=nowS();P.chat.push({me:1,t,ts});const rep=(BOT.find(([re])=>re.test(t))||[0,`Terima kasih, pesan Anda sudah kami catat dengan nomor tiket #${rnd().toUpperCase().slice(0,6)}. Tim kami akan membalas dalam 1x24 jam lewat nomor ponsel terdaftar.`])[1];P.chat=P.chat.slice(-40);save();S.tf={};render();setTimeout(()=>{P.chat.push({t:rep,ts:nowS()});P.chat=P.chat.slice(-40);save();if(S.sheet?.t==='cs'&&!$('#cm')?.value)render()},1200)}
};
document.addEventListener('click',e=>{if(NT.ok===null&&UID&&!NT.busy)askNotif();const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v,b,e)});
document.addEventListener('change',e=>{if((e.target.id==='qf'||e.target.id==='qg')&&e.target.files[0])decodeFile(e.target.files[0])});
document.addEventListener('input',e=>{const t=e.target,id=t.id;if(id==='q'){S.q=t.value;S.shown=20;$('#hl').innerHTML=histList();return}
if(id==='bq'){S.tf.bq=t.value;$('#bl').innerHTML=bankList();return}
if(id==='bq2'){S.tf.bq2=t.value;$('#bl2').innerHTML=bankList('tb','bq2');return}
if(id==='rek')t.value=t.value.replace(/\D/g,'').slice(0,20);
if(id==='amt'){const d=t.value.replace(/\D/g,'').slice(0,9);t.value=d?Number(d).toLocaleString('id-ID'):''}else if(['cur','np','cf'].includes(id))t.value=t.value.replace(/\D/g,'').slice(0,6);else if(id==='gr')t.value=t.value.replace(/[^0-9.,]/g,'').slice(0,10);
if(id==='ph')lookup();else if(t.closest('.sheet'))chk()});
document.addEventListener('keydown',e=>{if(S.locked||S.sheet?.t==='pin'){if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('⌫')}if(e.key==='Enter'&&e.target.id==='cm'){e.preventDefault();A.csend()}if(e.key==='Escape'&&S.sheet&&!S.locked)A.close()});
document.addEventListener('submit',async e=>{e.preventDefault();if(S.busy||e.target.id!=='af')return;const f=Object.fromEntries(new FormData(e.target));S.keep={name:f.name,phone:f.phone};S.busy=true;const r=S.mode==='register'?await register(f.name,f.phone,f.pass):await login(f.phone,f.pass);S.busy=false;S.err=r.err||'';if(r.ok){S.tab='home';S.keep={};S.locked=!!(P.prefs.lock&&P.pin);S.act=S.locked?{kind:'unlock'}:null}render()});
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{const u=me();if(document.hidden)hiddenAt=Date.now();else if(u&&P.prefs.lock&&P.pin&&hiddenAt&&Date.now()-hiddenAt>3e4){stopScan();S.locked=true;S.act={kind:'unlock'};S.sheet=null;S.pin='';render()}});
async function tick(){if(!me())return;scanIncoming();const n=await runSched()+await expireTopups();if(n&&!S.sheet&&!S.locked)render()}
function boot(){loadP();if(me()&&P.prefs.lock&&P.pin){S.locked=true;S.act={kind:'unlock'}}render();scanIncoming();askNotif();
window.addEventListener('storage',e=>{if(e.key!==K||!e.newValue)return;try{const d=JSON.parse(e.newValue);STORE=d;ACC=d.accounts;LED=d.ledger;REQ=d.requests;UID=d.session;loadP();scanIncoming();refresh()}catch(x){}});
setTimeout(tick,1500);setInterval(tick,3e4);fetchGold();setInterval(fetchGold,1e4)}
boot();
</script>
